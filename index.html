<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistencia — JDVM</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f5f7; margin: 0; padding: 0; color: #1b1f27; }
    header { background: linear-gradient(120deg, #1f3a5f, #2f6690); color: #fff; padding: 16px 18px; }
    header h1 { font-size: 16px; margin: 0; }
    nav { background: #fff; border-bottom: 1px solid #e6e8ec; overflow-x: auto; white-space: nowrap; }
    nav a { display: inline-block; padding: 10px 14px; font-size: 13px; color: #475569; text-decoration: none; font-weight: 600; }
    nav a.active, nav a:hover { color: #1f3a5f; border-bottom: 2px solid #1f3a5f; }
    .wrap { padding: 14px; padding-bottom: 90px; max-width: 720px; margin: 0 auto; }
    .nav-fecha { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .nav-btn { border: 1px solid #e6e8ec; background: #fff; border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 13px; font-weight: 700; color: #1f3a5f; flex-shrink: 0; }
    .fecha-centro { flex: 1; text-align: center; }
    .fecha-label { font-size: 14px; font-weight: 700; color: #1b1f27; text-transform: capitalize; }
    .hoy-btn { display: inline-block; margin-top: 4px; background: #1f3a5f; color: #fff; border: none; border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .ir-fecha { text-align: center; margin-bottom: 14px; }
    .ir-fecha summary { font-size: 12px; color: #6b7280; cursor: pointer; text-decoration: underline; }
    .ir-fecha input { margin-top: 6px; padding: 8px; border-radius: 8px; border: 1px solid #e6e8ec; font-size: 14px; }
    .licencia-box { background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; color: #075985; }
    .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); border: 1px solid #e6e8ec; }
    .nombre { font-weight: 700; font-size: 17px; }
    .meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .tag { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 20px; background: #eef2f7; color: #334155; margin: 3px 4px 0 0; line-height: 1.5; }
    .tag.torre { background: #dbeafe; color: #1e40af; }
    .btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 64px; padding: 9px 4px; border-radius: 10px; border: 1px solid #e6e8ec; background: #fff; font-weight: 700; font-size: 12px; text-align: center; cursor: pointer; }
    .btn.p.active { background: #10b981; color: #fff; border-color: transparent; }
    .btn.t.active { background: #f59e0b; color: #fff; border-color: transparent; }
    .btn.a.active { background: #f43f5e; color: #fff; border-color: transparent; }
    .btn.l.active { background: #0ea5e9; color: #fff; border-color: transparent; }
    .btn.o.active { background: #64748b; color: #fff; border-color: transparent; }
    select.motivo, input.horas { width: 100%; margin-top: 8px; padding: 8px; border-radius: 8px; border: 1px solid #e6e8ec; font-size: 13px; }
    input.horas.nota-req { border-color: #f59e0b; }
    .ya-marcado { font-size: 12px; color: #16a34a; font-weight: 600; margin-top: 8px; }
    .edit-link { background: none; border: none; color: #2f6690; font-weight: 700; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; margin-left: 4px; }
    .cancel-edit-btn { display: block; margin-top: 8px; background: #fff; color: #475569; border: 1px solid #e6e8ec; border-radius: 8px; padding: 8px; font-weight: 700; font-size: 12px; cursor: pointer; width: 100%; }
    .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e6e8ec; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
    .save-btn { background: #1f3a5f; color: #fff; border: none; border-radius: 10px; padding: 12px 20px; font-weight: 700; font-size: 14px; width: 100%; }
    .save-btn-top { position: sticky; top: 0; z-index: 5; background: #1f3a5f; color: #fff; border: none; border-radius: 10px; padding: 11px 16px; font-weight: 700; font-size: 13px; width: 100%; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
    .save-btn-top:disabled, .save-btn:disabled { opacity: .5; }
    .empty { text-align: center; color: #9aa2ab; font-size: 13px; padding: 30px 10px; }
    .status { text-align: center; font-size: 12px; color: #16a34a; margin-bottom: 6px; }
    .loading { text-align: center; padding: 40px; color: #9aa2ab; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Asistencia — JDVM</h1>
  </header>
  <nav>
    <a href="./index.html" class="active">Asistencia</a>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./turnos.html">Asignar</a>
    <a href="./catalogo.html">Catálogo</a>
    <a href="./distribucion.html">Distribución</a>
    <a href="./personal.html">Personal</a>
    <a href="./config.html">Torres/Deptos</a>
    <a href="./alertas.html">Alertas</a>
  </nav>
  <div class="wrap">
    <div class="nav-fecha" id="navFecha"></div>
    <details class="ir-fecha"><summary>Ir a una fecha específica</summary><div id="irFechaBox"></div></details>
    <button class="save-btn-top" id="saveBtnTop" onclick="guardar()" disabled>Guardar asistencia</button>
    <div id="contenido">
      <div class="loading">Cargando trabajadores del día...</div>
    </div>
  </div>
  <div class="footer">
    <button class="save-btn" id="saveBtn" onclick="guardar()" disabled>Guardar asistencia</button>
  </div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbw7QqZ8LAUmBjmvqJrc4blBkjfe1igMu24fCyQP9epk0NRwFceQ9kdINitBHvMtD--X/exec';
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIAS_LARGO = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  let SCHEDULE = [];
  let PERSONAL_ALL = [];
  let fechaActual = new Date().toISOString().slice(0, 10);
  const marks = {}; // rut -> {codigo, motivo, horasExtra, reemplazante, motivoHorasExtra, minutosAtraso, nota}
  const editando = {}; // rut -> true mientras se edita un registro ya guardado
  const CODIGO_LABEL = { P: 'Presente', T: 'Atraso', A: 'Ausente', L: 'Licencia', O: 'Otro' };

  function pad(n) { return String(n).padStart(2, '0'); }
  function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

  function etiquetaFecha() {
    const d = new Date(fechaActual + 'T00:00:00');
    return DIAS_LARGO[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
  }

  function renderNav() {
    const el = document.getElementById('navFecha');
    el.innerHTML =
      '<button class="nav-btn" onclick="mover(-1)">← Día anterior</button>' +
      '<div class="fecha-centro"><div class="fecha-label">' + etiquetaFecha() + '</div><button class="hoy-btn" onclick="irHoy()">Ir a Hoy</button></div>' +
      '<button class="nav-btn" onclick="mover(1)">Día siguiente →</button>';
    document.getElementById('irFechaBox').innerHTML =
      '<input type="date" value="' + fechaActual + '" onchange="fechaActual = this.value; renderNav(); cargarTodo();">';
  }
  function mover(dir) { fechaActual = addDays(fechaActual, dir); renderNav(); cargarTodo(); }
  function irHoy() { fechaActual = new Date().toISOString().slice(0, 10); renderNav(); cargarTodo(); }

  function cargarTodo() {
    document.getElementById('contenido').innerHTML = '<div class="loading">Cargando trabajadores del día...</div>';
    Object.keys(marks).forEach(k => delete marks[k]);
    updateSaveButton();
    Promise.all([
      fetch(API_URL + '?action=schedule&fecha=' + fechaActual).then(function(r){ return r.json(); }),
      fetch(API_URL + '?action=meta').then(function(r){ return r.json(); })
    ]).then(function(results) {
      PERSONAL_ALL = results[1].personal || [];
      render(results[0]);
    }).catch(showError);
  }

  function showError(err) {
    document.getElementById('contenido').innerHTML = '<div class="empty">Error al cargar: ' + err.message + '<br><br>Revisa que API_URL esté configurada en index.html.</div>';
  }

  function render(data) {
    SCHEDULE = data.trabajadores;

    let html = '';
    if (data.conLicenciaHoy && data.conLicenciaHoy.length) {
      html += '<div class="licencia-box"><b>Con permiso especial ese día:</b><br>' +
        data.conLicenciaHoy.map(function(p){ return p.nombre + ' — ' + p.tipo + ' hasta ' + p.hasta; }).join('<br>') +
        '</div>';
    }

    if (SCHEDULE.length === 0) {
      html += '<div class="empty">Nadie tiene turno asignado este día.</div>';
    } else {
      SCHEDULE.forEach(function(p) {
        html += cardHtml(p);
      });
    }
    document.getElementById('contenido').innerHTML = html;
  }

  function cardHtml(p) {
    const marcado = p.yaMarcado;
    const reemplazoOpts = PERSONAL_ALL.filter(x => x.rut !== p.rut).map(x => '<option value="' + x.rut + '">' + x.nombre + '</option>').join('');
    const enEdicion = editando[p.rut];
    return (
      '<div class="card" id="card-' + p.rut + '">' +
        '<div class="nombre">' + p.nombre + '</div>' +
        '<div class="meta">' +
          '<span class="tag">' + p.depto + '</span>' +
          '<span class="tag torre">' + p.torreNombre + '</span>' +
          '<span class="tag">' + p.turnoNombre + ' (' + p.horaInicio + '-' + p.horaFin + ')</span>' +
        '</div>' +
        (marcado && !enEdicion
          ? resumenMarcado(p, marcado)
          : formularioMarcado(p, reemplazoOpts, marcado)
        ) +
      '</div>'
    );
  }

  function resumenMarcado(p, marcado) {
    const detalle = [];
    if (marcado.codigo === 'T' && marcado.minutosAtraso) detalle.push(marcado.minutosAtraso + ' min de atraso');
    if (marcado.motivo) detalle.push(marcado.motivo);
    if (marcado.reemplazante) detalle.push('reemplazo: ' + marcado.reemplazante);
    return '<div class="ya-marcado">Ya marcado: <b>' + (CODIGO_LABEL[marcado.codigo] || marcado.codigo) + '</b>' +
      (detalle.length ? ' — ' + detalle.join(' · ') : '') +
      ' <button class="edit-link" onclick="empezarEdicionAsistencia(\'' + p.rut + '\')">Editar</button></div>';
  }

  function formularioMarcado(p, reemplazoOpts, marcado) {
    return (
            '<div class="btns">' +
              '<div class="btn p" onclick="marcar(\'' + p.rut + '\',\'P\')" id="btnP-' + p.rut + '">Presente</div>' +
              '<div class="btn t" onclick="marcar(\'' + p.rut + '\',\'T\')" id="btnT-' + p.rut + '">Atraso</div>' +
              '<div class="btn a" onclick="marcar(\'' + p.rut + '\',\'A\')" id="btnA-' + p.rut + '">Ausente</div>' +
              '<div class="btn l" onclick="marcar(\'' + p.rut + '\',\'L\')" id="btnL-' + p.rut + '">Licencia</div>' +
              '<div class="btn o" onclick="marcar(\'' + p.rut + '\',\'O\')" id="btnO-' + p.rut + '">Otro</div>' +
            '</div>' +

            '<select class="motivo" id="motivo-' + p.rut + '" style="display:none" onchange="setCampo(\'' + p.rut + '\',\'motivo\',this.value)">' +
              '<option value="">Motivo de la ausencia...</option>' +
              '<option>Médica</option><option>Personal</option><option>Injustificada</option><option>Sin aviso</option>' +
            '</select>' +

            '<input class="horas nota-req" id="atraso-min-' + p.rut + '" style="display:none" type="number" min="0" placeholder="Minutos de atraso" onchange="setCampo(\'' + p.rut + '\',\'minutosAtraso\',this.value)">' +

            '<input class="horas nota-req" id="nota-' + p.rut + '" style="display:none" type="text" placeholder="Nota (obligatoria)" onchange="setCampo(\'' + p.rut + '\',\'nota\',this.value)">' +

            '<select class="motivo" id="reemplazante-' + p.rut + '" style="display:none" onchange="setCampo(\'' + p.rut + '\',\'reemplazante\',this.value)">' +
              '<option value="">¿Quién lo reemplaza? (opcional)</option>' + reemplazoOpts +
            '</select>' +
            '<input class="horas" id="horasextra-' + p.rut + '" style="display:none" type="number" min="0" step="0.5" placeholder="Horas extra (opcional)" onchange="setCampo(\'' + p.rut + '\',\'horasExtra\',this.value)">' +
            '<input class="horas" id="motivohoras-' + p.rut + '" style="display:none" type="text" placeholder="Motivo de la hora extra (opcional)" onchange="setCampo(\'' + p.rut + '\',\'motivoHorasExtra\',this.value)">' +
            (marcado ? '<button class="cancel-edit-btn" onclick="cancelarEdicionAsistencia(\'' + p.rut + '\')">Cancelar edición</button>' : '')
    );
  }

  function marcar(rut, codigo) {
    marks[rut] = marks[rut] || {};
    // si tocan el mismo botón que ya estaba activo, se desmarca (vuelve a "sin marcar")
    const yaEstabaActivo = marks[rut].codigo === codigo;
    marks[rut].codigo = yaEstabaActivo ? undefined : codigo;
    const codigoFinal = marks[rut].codigo;

    ['P','T','A','L','O'].forEach(c => document.getElementById('btn' + c + '-' + rut).classList.toggle('active', c === codigoFinal));

    document.getElementById('motivo-' + rut).style.display = (codigoFinal === 'A') ? 'block' : 'none';
    document.getElementById('atraso-min-' + rut).style.display = (codigoFinal === 'T') ? 'block' : 'none';
    // nota obligatoria para todo lo que no sea Presente (y no sea Ausente, que ya tiene su propio motivo estructurado)
    document.getElementById('nota-' + rut).style.display = (codigoFinal === 'T' || codigoFinal === 'L' || codigoFinal === 'O') ? 'block' : 'none';
    document.getElementById('reemplazante-' + rut).style.display = (codigoFinal === 'A') ? 'block' : 'none';
    document.getElementById('horasextra-' + rut).style.display = (codigoFinal === 'A') ? 'block' : 'none';
    document.getElementById('motivohoras-' + rut).style.display = (codigoFinal === 'A') ? 'block' : 'none';
    updateSaveButton();
  }
  function setCampo(rut, campo, v) { marks[rut] = marks[rut] || {}; marks[rut][campo] = v; }

  function empezarEdicionAsistencia(rut) {
    editando[rut] = true;
    const p = SCHEDULE.find(x => x.rut === rut);
    render({ trabajadores: SCHEDULE, conLicenciaHoy: [] }); // re-dibuja sin perder la lista ya cargada
    // pre-cargar el formulario con los valores actuales guardados
    const m = p.yaMarcado;
    marks[rut] = { codigo: m.codigo, motivo: m.motivo || '', horasExtra: m.horasExtra || '', reemplazante: '', motivoHorasExtra: m.motivoHorasExtra || '', minutosAtraso: m.minutosAtraso || '', nota: (m.codigo !== 'A' ? m.motivo || '' : '') };
    marcar(rut, m.codigo);
    if (m.motivo && m.codigo === 'A') document.getElementById('motivo-' + rut).value = m.motivo;
    if (m.motivo && m.codigo !== 'A') document.getElementById('nota-' + rut).value = m.motivo;
    if (m.minutosAtraso) document.getElementById('atraso-min-' + rut).value = m.minutosAtraso;
    if (m.horasExtra) document.getElementById('horasextra-' + rut).value = m.horasExtra;
    if (m.motivoHorasExtra) document.getElementById('motivohoras-' + rut).value = m.motivoHorasExtra;
    reaplicarMarcasVisuales();
    updateSaveButton();
  }

  function cancelarEdicionAsistencia(rut) {
    delete editando[rut];
    delete marks[rut];
    render({ trabajadores: SCHEDULE, conLicenciaHoy: [] });
    reaplicarMarcasVisuales();
    updateSaveButton();
  }

  /** Después de redibujar la lista (al entrar/salir de modo edición), vuelve a marcar visualmente
   *  a todos los que ya tenían algo seleccionado antes, para no perder lo hecho en otras tarjetas. */
  function reaplicarMarcasVisuales() {
    Object.keys(marks).forEach(function(rut) {
      const codigo = marks[rut].codigo;
      const btnEl = document.getElementById('btnP-' + rut);
      if (!codigo || !btnEl) return;
      ['P','T','A','L','O'].forEach(c => { const el = document.getElementById('btn' + c + '-' + rut); if (el) el.classList.toggle('active', c === codigo); });
      const show = function(id, cond) { const el = document.getElementById(id); if (el) el.style.display = cond ? 'block' : 'none'; };
      show('motivo-' + rut, codigo === 'A');
      show('atraso-min-' + rut, codigo === 'T');
      show('nota-' + rut, codigo === 'T' || codigo === 'L' || codigo === 'O');
      show('reemplazante-' + rut, codigo === 'A');
      show('horasextra-' + rut, codigo === 'A');
      show('motivohoras-' + rut, codigo === 'A');
    });
  }

  function updateSaveButton() {
    const n = Object.keys(marks).filter(function(r){ return marks[r].codigo; }).length;
    const texto = n === 0 ? 'Guardar asistencia' : 'Guardar asistencia (' + n + ')';
    ['saveBtn', 'saveBtnTop'].forEach(function(id) {
      const btn = document.getElementById(id);
      btn.disabled = n === 0;
      btn.textContent = texto;
    });
  }

  function guardar() {
    // validar que las notas obligatorias estén completas antes de guardar
    const faltantes = [];
    SCHEDULE.forEach(function(p) {
      const m = marks[p.rut];
      if (!m || !m.codigo) return;
      if (m.codigo === 'A' && !m.motivo) faltantes.push(p.nombre + ' (falta motivo de ausencia)');
      if (m.codigo === 'T' && (!m.minutosAtraso || !m.nota)) faltantes.push(p.nombre + ' (falta minutos de atraso y/o nota)');
      if ((m.codigo === 'L' || m.codigo === 'O') && !m.nota) faltantes.push(p.nombre + ' (falta nota)');
    });
    if (faltantes.length > 0) {
      alert('Completa lo siguiente antes de guardar:\n\n' + faltantes.join('\n'));
      return;
    }

    const records = [];
    const ediciones = [];
    SCHEDULE.forEach(function(p) {
      const m = marks[p.rut];
      if (m && m.codigo) {
        const reemplazanteNombre = m.reemplazante ? (PERSONAL_ALL.find(x => x.rut === m.reemplazante) || {}).nombre : '';
        // para Atraso/Licencia/Otro, la nota va en el mismo campo "motivo" para quedar guardada
        const motivoFinal = m.codigo === 'A' ? (m.motivo || '') : (m.nota || '');
        const datos = {
          rut: p.rut, nombre: p.nombre, codigo: m.codigo,
          motivo: motivoFinal, horasExtra: m.horasExtra || '',
          torre: p.torre, turnoNombre: p.turnoNombre,
          reemplazante: reemplazanteNombre || '', motivoHorasExtra: m.motivoHorasExtra || '',
          minutosAtraso: m.minutosAtraso || ''
        };
        if (editando[p.rut]) ediciones.push(datos);
        else records.push(datos);
      }
    });
    if (records.length === 0 && ediciones.length === 0) return;
    ['saveBtn', 'saveBtnTop'].forEach(function(id) {
      document.getElementById(id).disabled = true;
      document.getElementById(id).textContent = 'Guardando...';
    });

    const llamadas = [];
    if (records.length > 0) {
      llamadas.push(fetch(API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submit', fecha: fechaActual, records: records })
      }).then(function(r){ return r.json(); }));
    }
    ediciones.forEach(function(datos) {
      llamadas.push(fetch(API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'editarAsistencia', fecha: fechaActual, rut: datos.rut, cambios: {
          codigo: datos.codigo, motivo: datos.motivo, horasExtra: datos.horasExtra,
          reemplazante: datos.reemplazante, motivoHorasExtra: datos.motivoHorasExtra, minutosAtraso: datos.minutosAtraso
        } })
      }).then(function(r){ return r.json(); }));
    });

    Promise.all(llamadas)
      .then(function(resultados) {
        const conError = resultados.find(function(r){ return r.error; });
        if (conError) throw new Error(conError.error);
        const total = records.length + ediciones.length;
        document.getElementById('contenido').innerHTML = '<div class="status">✓ Guardado — ' + total + ' registro(s)</div>';
        setTimeout(function(){ cargarTodo(); }, 1000);
      })
      .catch(function(err) {
        alert('Error al guardar: ' + err.message);
        ['saveBtn', 'saveBtnTop'].forEach(function(id) { document.getElementById(id).disabled = false; });
      });
  }

  renderNav();
  cargarTodo();
</script>
</body>
</html>
