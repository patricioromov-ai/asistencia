<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal — JDVM</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f5f7; margin: 0; color: #1b1f27; }
  header { background: linear-gradient(120deg, #1f3a5f, #2f6690); color: #fff; padding: 16px 18px; }
  header h1 { font-size: 16px; margin: 0; }
  nav { background: #fff; border-bottom: 1px solid #e6e8ec; overflow-x: auto; white-space: nowrap; }
  nav a { display: inline-block; padding: 10px 14px; font-size: 13px; color: #475569; text-decoration: none; font-weight: 600; }
  nav a.active, nav a:hover { color: #1f3a5f; border-bottom: 2px solid #1f3a5f; }
  .wrap { padding: 16px; max-width: 900px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #e6e8ec; margin-bottom: 14px; }
  .card h3 { font-size: 14px; margin: 0 0 10px; display:flex; justify-content:space-between; align-items:center; }
  .add-btn, .save-btn { background: #1f3a5f; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  @media (min-width: 640px) { .form-grid { grid-template-columns: repeat(3, 1fr); } }
  .form-grid label { display: block; font-size: 11px; color: #6b7280; font-weight: 600; margin-bottom: 3px; }
  input, select { font-size: 12px; padding: 7px; border-radius: 6px; border: 1px solid #e6e8ec; width: 100%; }
  .cancel-btn { background: #fff; color: #475569; border: 1px solid #e6e8ec; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .persona { border-bottom: 1px solid #f0f1f3; padding: 10px 0; }
  .persona:last-child { border-bottom: none; }
  .persona.inactivo { opacity: .55; }
  .p-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
  .p-info { cursor: pointer; max-width: 100%; }
  .nombre { font-weight: 700; font-size: 14px; }
  .meta { font-size: 12px; color: #6b7280; margin: 3px 0 6px; }
  .meta span { margin-right: 6px; }
  .tags-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: #eef2f7; color: #334155; margin: 2px 4px 2px 0; line-height: 1.4; }
  .tag.off { background: #fee2e2; color: #b91c1c; }
  .ver-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px; }
  @media (min-width: 640px) { .ver-grid { grid-template-columns: repeat(3, 1fr); } }
  .ver-grid label { display: block; font-size: 11px; color: #6b7280; font-weight: 600; margin-bottom: 2px; }
  .ver-grid div div { color: #1b1f27; }
  .actions { display: flex; gap: 10px; align-items: center; }
  .link-btn { border: none; background: none; font-weight: 700; cursor: pointer; font-size: 12px; }
  .link-btn.edit { color: #2f6690; }
  .link-btn.toggle { color: #d97706; }
  .link-btn.del { color: #f43f5e; }
  .panel { display: none; margin-top: 10px; padding: 10px; background: #f8fafc; border-radius: 8px; }
  .panel.open { display: block; }
  .estado-row { display: flex; justify-content: space-between; font-size: 11px; background: #fff; padding: 5px 8px; border-radius: 6px; margin-top: 4px; }
  .loading, .empty { text-align: center; color: #9aa2ab; padding: 20px; font-size: 13px; }
</style>
</head>
<body>
<header><h1>Personal — JDVM</h1></header>
<nav>
  <a href="./index.html">Asistencia</a>
  <a href="./dashboard.html">Dashboard</a>
  <a href="./turnos.html">Asignar</a>
  <a href="./catalogo.html">Catálogo</a>
  <a href="./distribucion.html">Distribución</a>
  <a href="./personal.html" class="active">Personal</a>
  <a href="./config.html">Torres/Deptos</a>
  <a href="./alertas.html">Alertas</a>
</nav>
<div class="wrap">
  <div class="card">
    <h3>Nuevo trabajador <button class="add-btn" onclick="toggleForm()">+ Agregar</button></h3>
    <div id="form" style="display:none;">
      <div class="form-grid">
        <input id="fNombre" placeholder="Nombre completo">
        <input id="fRut" placeholder="RUT">
        <select id="fCargo" onchange="document.getElementById('fCargoOtro').style.display = (this.value==='Otro')?'block':'none';"></select>
        <input id="fCargoOtro" placeholder="Especificar cargo" style="display:none;">
        <select id="fDepto"></select>
        <select id="fTorre"></select>
        <select id="fContrato"><option>Indefinido</option><option>Plazo Fijo</option></select>
        <input id="fSueldo" type="number" placeholder="Sueldo base">
        <input id="fHoras" type="number" placeholder="Horas contrato/sem." value="40">
        <input id="fTelefono" placeholder="Teléfono">
        <input id="fFechaIngreso" type="date" placeholder="Fecha ingreso">
        <input id="fFechaNacimiento" type="date" placeholder="Fecha nacimiento">
      </div>
      <button class="save-btn" onclick="agregarPersona()">Guardar</button>
    </div>
  </div>
  <div class="card">
    <h3>Trabajadores</h3>
    <div id="listado" class="loading">Cargando...</div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbw7QqZ8LAUmBjmvqJrc4blBkjfe1igMu24fCyQP9epk0NRwFceQ9kdINitBHvMtD--X/exec';
  let PERSONAL = [], ESTADOS = [], DEPTOS = [], TORRES = [];
  let panelAbierto = {};

  cargar();
  function cargar() {
    Promise.all([
      fetch(API_URL + '?action=personalFull').then(r => r.json()),
      fetch(API_URL + '?action=estados').then(r => r.json()),
      fetch(API_URL + '?action=departamentos').then(r => r.json()),
      fetch(API_URL + '?action=torres').then(r => r.json())
    ]).then(([p, e, d, t]) => { PERSONAL = p; ESTADOS = e; DEPTOS = d; TORRES = t; render(); })
      .catch(err => { document.getElementById('listado').textContent = 'Error: ' + err.message; });
  }

  function toggleForm() {
    const f = document.getElementById('form');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
    document.getElementById('fDepto').innerHTML = DEPTOS.map(d => '<option>' + d.Nombre + '</option>').join('');
    document.getElementById('fTorre').innerHTML = '<option value="">(sin torre)</option>' + TORRES.map(t => '<option value="' + t.ID + '">' + t.Nombre + '</option>').join('');
    document.getElementById('fCargo').innerHTML = CARGOS.map(c => '<option>' + c + '</option>').join('');
  }

  function render() {
    if (!PERSONAL.length) { document.getElementById('listado').innerHTML = '<div class="empty">Sin trabajadores.</div>'; return; }
    let html = '';
    PERSONAL.forEach(p => {
      const activo = String(p.Activo).toUpperCase() === 'SI';
      const misEstados = ESTADOS.filter(e => String(e.RUT).trim() === String(p.RUT).trim());
      const abierto = panelAbierto[p.RUT] || 'none';
      html += '<div class="persona' + (activo ? '' : ' inactivo') + '">' +
        '<div class="p-head">' +
          '<div class="p-info" onclick="togglePanel(\'' + p.RUT + '\',\'ver\')">' +
            '<div class="nombre">' + p.Nombre + '</div>' +
            '<div class="meta"><span>' + p.RUT + '</span><span>' + p.Cargo + '</span>' + (p.Telefono ? '<span>' + p.Telefono + '</span>' : '') + '</div>' +
            '<div class="tags-row">' +
              '<span class="tag">' + p.Departamento + '</span>' +
              '<span class="tag">' + (p.HorasContractuales||40) + 'h/sem contrato</span>' +
              (activo ? '' : '<span class="tag off">Inactivo</span>') +
            '</div>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="link-btn edit" onclick="togglePanel(\'' + p.RUT + '\',\'editar\')">Editar</button>' +
            '<button class="link-btn edit" onclick="togglePanel(\'' + p.RUT + '\',\'estados\')">Vacaciones/Licencia</button>' +
            '<button class="link-btn toggle" onclick="toggleActivo(\'' + p.RUT + '\',' + activo + ')">' + (activo ? 'Desactivar' : 'Reactivar') + '</button>' +
            '<button class="link-btn del" onclick="eliminarPersona(\'' + p.RUT + '\',\'' + p.Nombre.replace(/'/g,"") + '\')">Eliminar</button>' +
          '</div>' +
        '</div>' +
        panelVer(p, abierto === 'ver') +
        panelEditar(p, abierto === 'editar') +
        panelEstados(p, misEstados, abierto === 'estados') +
      '</div>';
    });
    document.getElementById('listado').innerHTML = html;
  }

  function togglePanel(rut, cual) {
    panelAbierto[rut] = (panelAbierto[rut] === cual) ? 'none' : cual;
    render();
  }

  function panelVer(p, abierto) {
    if (!abierto) return '<div class="panel" id="ver-' + p.RUT + '"></div>';
    const torreNombre = (TORRES.find(t => t.ID === p.Torre) || {}).Nombre || '(sin torre)';
    return '<div class="panel open" id="ver-' + p.RUT + '">' +
      '<div class="ver-grid">' +
        '<div><label>RUT</label><div>' + p.RUT + '</div></div>' +
        '<div><label>Cargo</label><div>' + (p.Cargo||'—') + '</div></div>' +
        '<div><label>Departamento</label><div>' + (p.Departamento||'—') + '</div></div>' +
        '<div><label>Torre</label><div>' + torreNombre + '</div></div>' +
        '<div><label>Contrato</label><div>' + (p.Contrato||'—') + '</div></div>' +
        '<div><label>Horas contrato/sem.</label><div>' + (p.HorasContractuales||40) + 'h</div></div>' +
        '<div><label>Teléfono</label><div>' + (p.Telefono||'—') + '</div></div>' +
        '<div><label>Fecha ingreso</label><div>' + (p.FechaIngreso||'—') + '</div></div>' +
        '<div><label>Fecha nacimiento</label><div>' + (p.FechaNacimiento||'—') + '</div></div>' +
        '<div><label>Estado</label><div>' + (String(p.Activo).toUpperCase()==='SI' ? 'Activo' : 'Inactivo') + '</div></div>' +
      '</div>' +
      '<div style="font-size:10px;color:#9aa2ab;margin-top:6px;">El sueldo base no se muestra aquí por confidencialidad — se administra directo en el Sheet.</div>' +
    '</div>';
  }

  const CARGOS = ['Conserje','Primer Conserje','Portero','Nochero','Conserje part time','Auxiliar','Auxiliar de aseo','Supervisor de aseo','Aseador(a)','Volante','Supervisora','Mantención','Reciclador','Otro'];

  function panelEditar(p, abierto) {
    const deptoOpts = DEPTOS.map(d => '<option' + (d.Nombre===p.Departamento?' selected':'') + '>' + d.Nombre + '</option>').join('');
    const torreOpts = '<option value="">(sin torre)</option>' + TORRES.map(t => '<option value="' + t.ID + '"' + (t.ID===p.Torre?' selected':'') + '>' + t.Nombre + '</option>').join('');
    const cargoConocido = CARGOS.slice(0, -1).includes(p.Cargo);
    const cargoOpts = CARGOS.map(c => '<option' + (c===p.Cargo?' selected':'') + '>' + c + '</option>').join('');
    return '<div class="panel' + (abierto ? ' open' : '') + '" id="editar-' + p.RUT + '">' +
      '<div class="form-grid">' +
        '<div><label>Nombre</label><input id="e-Nombre-' + p.RUT + '" value="' + p.Nombre + '"></div>' +
        '<div><label>Cargo</label><select id="e-Cargo-' + p.RUT + '" onchange="toggleCargoOtro(\'' + p.RUT + '\')">' + cargoOpts + (cargoConocido ? '' : '') + '</select>' +
          '<input id="e-CargoOtro-' + p.RUT + '" placeholder="Especificar cargo" value="' + (cargoConocido ? '' : p.Cargo||'') + '" style="margin-top:4px;display:' + (p.Cargo==='Otro'||!cargoConocido&&p.Cargo ? 'block':'none') + ';"></div>' +
        '<div><label>Departamento</label><select id="e-Departamento-' + p.RUT + '">' + deptoOpts + '</select></div>' +
        '<div><label>Torre</label><select id="e-Torre-' + p.RUT + '">' + torreOpts + '</select></div>' +
        '<div><label>Contrato</label><select id="e-Contrato-' + p.RUT + '"><option' + (p.Contrato==='Indefinido'?' selected':'') + '>Indefinido</option><option' + (p.Contrato==='Plazo Fijo'?' selected':'') + '>Plazo Fijo</option></select></div>' +
        '<div><label>Horas contrato/sem.</label><input id="e-HorasContractuales-' + p.RUT + '" type="number" value="' + (p.HorasContractuales||40) + '"></div>' +
        '<div><label>Teléfono</label><input id="e-Telefono-' + p.RUT + '" value="' + (p.Telefono||'') + '"></div>' +
        '<div><label>Fecha ingreso</label><input id="e-FechaIngreso-' + p.RUT + '" value="' + (p.FechaIngreso||'') + '" placeholder="DD-MM-AAAA"></div>' +
        '<div><label>Fecha nacimiento</label><input id="e-FechaNacimiento-' + p.RUT + '" value="' + (p.FechaNacimiento||'') + '" placeholder="DD-MM-AAAA"></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
        '<button class="save-btn" onclick="guardarEdicion(\'' + p.RUT + '\')">Guardar cambios</button>' +
        '<button class="cancel-btn" onclick="togglePanel(\'' + p.RUT + '\',\'editar\')">Cancelar</button>' +
      '</div>' +
    '</div>';
  }

  function toggleCargoOtro(rut) {
    const sel = document.getElementById('e-Cargo-' + rut).value;
    document.getElementById('e-CargoOtro-' + rut).style.display = (sel === 'Otro') ? 'block' : 'none';
  }

  function guardarEdicion(rut) {
    const cargoSel = val('e-Cargo-' + rut);
    const cargoFinal = cargoSel === 'Otro' ? val('e-CargoOtro-' + rut) : cargoSel;
    const cambios = {
      Nombre: val('e-Nombre-' + rut), Cargo: cargoFinal, Departamento: val('e-Departamento-' + rut),
      Torre: val('e-Torre-' + rut), Contrato: val('e-Contrato-' + rut),
      HorasContractuales: Number(val('e-HorasContractuales-' + rut)) || 40,
      Telefono: val('e-Telefono-' + rut), FechaIngreso: val('e-FechaIngreso-' + rut), FechaNacimiento: val('e-FechaNacimiento-' + rut)
    };
    post({ action: 'editarPersona', rut, cambios }).then(() => cargar()).catch(err => alert('Error: ' + err.message));
  }
  function val(id) { return document.getElementById(id).value; }

  function panelEstados(p, misEstados, abierto) {
    return '<div class="panel' + (abierto ? ' open' : '') + '" id="estados-' + p.RUT + '">' +
      '<div style="font-size:11px;font-weight:700;margin-bottom:6px;">Vacaciones / Licencia médica</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">' +
        '<select id="tipo-' + p.RUT + '"><option>Vacaciones</option><option>Licencia Médica</option></select>' +
        '<input type="date" id="ini-' + p.RUT + '">' +
        '<input type="date" id="fin-' + p.RUT + '">' +
        '<button class="save-btn" onclick="agregarEstado(\'' + p.RUT + '\')">Agregar</button>' +
      '</div>' +
      (misEstados.map(e => '<div class="estado-row"><span>' + e.Tipo + ' · ' + e.FechaInicio + ' → ' + e.FechaTermino + '</span>' +
        '<button class="link-btn del" onclick="eliminarEstado(\'' + e.ID + '\')">Quitar</button></div>').join('') || '<div style="font-size:11px;color:#9aa2ab;">Sin registros.</div>') +
    '</div>';
  }

  function post(body) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(r => r.json());
  }

  function agregarPersona() {
    const nombre = document.getElementById('fNombre').value;
    const rut = document.getElementById('fRut').value;
    if (!nombre || !rut) { alert('Nombre y RUT son obligatorios.'); return; }
    const cargoSel = document.getElementById('fCargo').value;
    const cargo = cargoSel === 'Otro' ? document.getElementById('fCargoOtro').value : cargoSel;
    const persona = {
      nombre, rut, cargo,
      depto: document.getElementById('fDepto').value, torre: document.getElementById('fTorre').value,
      contrato: document.getElementById('fContrato').value,
      sueldoBase: document.getElementById('fSueldo').value, horasContractuales: document.getElementById('fHoras').value,
      telefono: document.getElementById('fTelefono').value,
      fechaIngreso: document.getElementById('fFechaIngreso').value, fechaNacimiento: document.getElementById('fFechaNacimiento').value
    };
    post({ action: 'agregarPersona', persona }).then(() => { toggleForm(); cargar(); }).catch(err => alert('Error: ' + err.message));
  }

  function toggleActivo(rut, activoActual) {
    post({ action: 'editarPersona', rut, cambios: { Activo: activoActual ? 'NO' : 'SI' } })
      .then(() => cargar()).catch(err => alert('Error: ' + err.message));
  }

  function eliminarPersona(rut, nombre) {
    if (!confirm('¿Eliminar definitivamente a ' + nombre + '? Esto también borra sus asignaciones de turno. Si solo quieres que deje de aparecer, usa "Desactivar" en vez de esto.')) return;
    post({ action: 'eliminarPersona', rut }).then(() => cargar()).catch(err => alert('Error: ' + err.message));
  }

  function agregarEstado(rut) {
    const tipo = document.getElementById('tipo-' + rut).value;
    const fechaInicio = document.getElementById('ini-' + rut).value;
    const fechaTermino = document.getElementById('fin-' + rut).value;
    if (!fechaInicio || !fechaTermino) { alert('Completa ambas fechas.'); return; }
    post({ action: 'agregarEstado', estado: { rut, tipo, fechaInicio, fechaTermino } }).then(() => cargar()).catch(err => alert('Error: ' + err.message));
  }
  function eliminarEstado(id) {
    post({ action: 'eliminarEstado', id }).then(() => cargar()).catch(err => alert('Error: ' + err.message));
  }
</script>
</body>
</html>
